<title>Asset Track Back-Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: fixed dark side rail + light scrolling work area; cards on a tinted neutral ground.
     Telematics ops tool — grey/red brand, semantic green/amber/red for device & SLA state.
     Tablet-first targets: controls >= 40px so technicians can work on tablets. */
  :root {
    --brand-red: #e31e24;
    --brand-red-ink: #b3161b;
    --rail: #2b2b2e;
    --rail-ink: #e9e9ec;
    --rail-dim: #9a9aa2;
    --rail-line: #3c3c40;
    --bg: #ececed;
    --surface: #ffffff;
    --surface-2: #f6f6f7;
    --fg: #26262a;
    --fg-dim: #6c6c74;
    --line: #dddde1;
    --good: #1f9254;
    --good-bg: #e4f3ea;
    --warn: #b7791f;
    --warn-bg: #fbf1dd;
    --crit: #d1232a;
    --crit-bg: #fbe6e7;
    --info: #2563a8;
    --info-bg: #e5eef8;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(20,20,25,.06), 0 2px 10px rgba(20,20,25,.05);
    --f-head: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
    --f-body: "Inter", ui-sans-serif, system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --rail: #202023; --rail-ink: #e9e9ec; --rail-dim: #8f8f98; --rail-line: #333337;
      --bg: #161618; --surface: #1f1f22; --surface-2: #27272b; --fg: #e7e7ea; --fg-dim: #9a9aa3; --line: #34343a;
      --good: #4ac07e; --good-bg: #163024; --warn: #e0a84a; --warn-bg: #3a2e14; --crit: #f06a6f; --crit-bg: #3a1a1c; --info: #6ba6e6; --info-bg: #15293f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.28);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --rail: #202023; --rail-ink: #e9e9ec; --rail-dim: #8f8f98; --rail-line: #333337;
    --bg: #161618; --surface: #1f1f22; --surface-2: #27272b; --fg: #e7e7ea; --fg-dim: #9a9aa3; --line: #34343a;
    --good: #4ac07e; --good-bg: #163024; --warn: #e0a84a; --warn-bg: #3a2e14; --crit: #f06a6f; --crit-bg: #3a1a1c; --info: #6ba6e6; --info-bg: #15293f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.28);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1,h2,h3,h4 { font-family: var(--f-head); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
  button { font-family: inherit; }
  .tnum { font-variant-numeric: tabular-nums; }

  .app { display: flex; min-height: 100%; }

  /* Side rail */
  .rail { position: fixed; top:0; bottom:0; left:0; width: 236px; z-index: 40; background: var(--rail); color: var(--rail-ink); display:flex; flex-direction:column; padding-left: env(safe-area-inset-left,0px); transition: transform .22s ease; }
  .rail__brand { display:flex; align-items:center; gap:10px; padding: 18px 18px 14px; padding-top: calc(18px + env(safe-area-inset-top,0px)); border-bottom:1px solid var(--rail-line); }
  .logo-mark { width:30px; height:30px; border-radius:7px; background: var(--brand-red); position:relative; flex:none; }
  .logo-mark::after { content:""; position:absolute; inset:9px; border:2.5px solid #fff; border-radius:50%; }
  .logo-mark::before { content:""; position:absolute; left:50%; top:50%; width:2.5px; height:9px; background:#fff; transform: translate(-50%,-100%); }
  .brand-name { font-family: var(--f-head); font-weight:700; font-size:15px; line-height:1.05; letter-spacing:-.02em; }
  .brand-sub { font-size:10.5px; color: var(--rail-dim); letter-spacing:.06em; text-transform:uppercase; }
  .nav { flex:1; overflow-y:auto; padding: 10px 10px 16px; }
  .nav__label { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color: var(--rail-dim); padding: 12px 10px 5px; }
  .nav__item { display:flex; align-items:center; gap:11px; width:100%; padding: 10px 11px; margin:1px 0; border:0; border-radius:8px; background:transparent; color: var(--rail-ink); cursor:pointer; font-size:13.5px; text-align:left; border-left:3px solid transparent; }
  .nav__item:hover { background: rgba(255,255,255,.05); }
  .nav__item.is-active { background: rgba(227,30,36,.14); border-left-color: var(--brand-red); color:#fff; font-weight:500; }
  .nav__item .ico { width:18px; height:18px; flex:none; opacity:.92; }
  .nav__item .ct { margin-left:auto; font-size:11px; background: rgba(255,255,255,.1); color: var(--rail-ink); padding:1px 7px; border-radius:20px; min-width:20px; text-align:center; }
  .nav__item.is-active .ct { background: var(--brand-red); color:#fff; }
  .rail__foot { border-top:1px solid var(--rail-line); padding: 12px 14px; padding-bottom: calc(12px + env(safe-area-inset-bottom,0px)); }
  .viewas { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color: var(--rail-dim); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .viewas-row { display:flex; align-items:center; gap:10px; }
  .avatar { width:30px; height:30px; border-radius:50%; background: var(--brand-red); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12px; flex:none; font-family: var(--f-head); }
  .uselect { flex:1; min-width:0; background: rgba(255,255,255,.06); color: var(--rail-ink); border:1px solid var(--rail-line); border-radius:8px; padding:7px 8px; font:inherit; font-size:12.5px; outline:none; }

  /* Main */
  .main { flex:1; min-width:0; margin-left:236px; display:flex; flex-direction:column; }
  .topbar { position:sticky; top: env(safe-area-inset-top,0px); z-index:30; display:flex; align-items:center; gap:12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom:1px solid var(--line); padding: 11px 0; padding-left: max(20px, env(safe-area-inset-left,0px)); padding-right: max(20px, env(safe-area-inset-right,0px)); }
  body::before { content:""; position:fixed; inset:0 0 auto; height: env(safe-area-inset-top,0px); z-index:31; background: var(--bg); }
  .hamburger { display:none; width:40px; height:40px; border-radius:8px; border:1px solid var(--line); background: var(--surface); color: var(--fg); cursor:pointer; flex:none; align-items:center; justify-content:center; }
  .topbar h1 { font-size:17px; }
  .topbar .crumb { font-size:11.5px; color: var(--fg-dim); letter-spacing:.04em; text-transform:uppercase; }
  .topbar .spacer { flex:1; }
  .btn { display:inline-flex; align-items:center; gap:7px; cursor:pointer; border-radius:8px; border:1px solid var(--line); background: var(--surface); color: var(--fg); padding:9px 13px; font-size:13px; font-weight:500; white-space:nowrap; min-height:40px; }
  .btn:hover { background: var(--surface-2); }
  .btn--primary { background: var(--brand-red); border-color: var(--brand-red); color:#fff; }
  .btn--primary:hover { background: var(--brand-red-ink); }
  .btn--ghost { background:transparent; }
  .btn--danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); background: var(--crit-bg); }
  .btn .ico { width:16px; height:16px; }
  .btn--sm { padding:7px 10px; font-size:12px; min-height:34px; }

  .view { padding:20px; padding-left:max(20px, env(safe-area-inset-left,0px)); padding-right:max(20px, env(safe-area-inset-right,0px)); padding-bottom: calc(40px + env(safe-area-inset-bottom,0px)); max-width:1180px; width:100%; }

  .kpis { display:grid; grid-template-columns: repeat(auto-fit, minmax(158px,1fr)); gap:12px; margin-bottom:18px; }
  .kpi { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding:14px 15px; box-shadow: var(--shadow); }
  .kpi__label { font-size:11.5px; color: var(--fg-dim); text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:6px; }
  .kpi__val { font-family: var(--f-head); font-size:27px; font-weight:600; margin-top:7px; line-height:1; letter-spacing:-.02em; }
  .kpi__val small { font-size:14px; color: var(--fg-dim); font-weight:500; }
  .kpi__meta { font-size:11.5px; margin-top:6px; color: var(--fg-dim); }
  .kpi__meta.up { color: var(--good); } .kpi__meta.down { color: var(--crit); }
  .kpi.accent { border-top:3px solid var(--brand-red); }

  .grid { display:grid; gap:16px; }
  .grid--2 { grid-template-columns: 1.4fr 1fr; }
  .card { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; }
  .card__head { display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line); }
  .card__head h3 { font-size:14.5px; }
  .card__head .spacer { flex:1; }
  .card__head .link { font-size:12px; color: var(--brand-red); background:none; border:0; cursor:pointer; font-weight:500; }
  .card__body { padding:6px 16px 14px; }
  .card__body.flush { padding:0; }

  .alert { display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
  .alert:last-child { border-bottom:0; }
  .alert__dot { width:9px; height:9px; border-radius:50%; margin-top:5px; flex:none; }
  .alert__body { flex:1; min-width:0; }
  .alert__title { font-size:13px; font-weight:500; }
  .alert__meta { font-size:11.5px; color: var(--fg-dim); margin-top:2px; }
  .alert__act { font-size:12px; color: var(--brand-red); background:none; border:0; cursor:pointer; font-weight:500; padding:4px 0; flex:none; }

  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; white-space:nowrap; letter-spacing:.01em; }
  .badge .d { width:6px; height:6px; border-radius:50%; background: currentColor; }
  .b-good { color: var(--good); background: var(--good-bg); }
  .b-warn { color: var(--warn); background: var(--warn-bg); }
  .b-crit { color: var(--crit); background: var(--crit-bg); }
  .b-info { color: var(--info); background: var(--info-bg); }
  .b-neutral { color: var(--fg-dim); background: var(--surface-2); }
  .prio-urgent { color:#fff; background: var(--brand-red); }
  .prio-high { color: var(--crit); background: var(--crit-bg); }
  .prio-medium { color: var(--warn); background: var(--warn-bg); }
  .prio-low { color: var(--fg-dim); background: var(--surface-2); }

  .tablewrap { overflow-x:auto; }
  table.data { width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
  table.data th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color: var(--fg-dim); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--line); background: var(--surface-2); position:sticky; top:0; }
  table.data td { padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.data tr:last-child td { border-bottom:0; }
  table.data tr.clickable { cursor:pointer; }
  table.data tr.clickable:hover td { background: var(--surface-2); }
  .cellmuted { color: var(--fg-dim); font-size:12px; }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .chipset { display:flex; gap:6px; flex-wrap:wrap; }
  .chip { font-size:12.5px; padding:8px 13px; border-radius:20px; border:1px solid var(--line); background: var(--surface); color: var(--fg-dim); cursor:pointer; font-weight:500; }
  .chip.is-on { background: var(--fg); color: var(--surface); border-color: var(--fg); }
  .toolbar .spacer { flex:1; }

  .board { display:grid; grid-template-columns: repeat(3, minmax(230px,1fr)); gap:12px; }
  .board__col { background: var(--surface-2); border:1px solid var(--line); border-radius: var(--radius); display:flex; flex-direction:column; min-height:120px; }
  .board__colhead { padding:10px 13px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
  .board__colhead .n { margin-left:auto; background: var(--surface); border:1px solid var(--line); border-radius:20px; padding:0 8px; font-size:11px; }
  .board__list { padding:10px; display:flex; flex-direction:column; gap:9px; }
  .jobcard { background: var(--surface); border:1px solid var(--line); border-radius:9px; padding:11px; cursor:pointer; box-shadow: var(--shadow); }
  .jobcard:hover { border-color: var(--brand-red); }
  .jobcard__ref { font-size:10.5px; color: var(--fg-dim); font-family: var(--f-head); letter-spacing:.03em; }
  .jobcard__client { font-size:13.5px; font-weight:600; margin:2px 0 4px; }
  .jobcard__row { font-size:12px; color: var(--fg-dim); display:flex; align-items:center; gap:6px; }
  .jobcard__foot { display:flex; align-items:center; gap:8px; margin-top:8px; }

  .detail-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap:14px; }
  .field label { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color: var(--fg-dim); } .field .v { font-size:14px; font-weight:500; margin-top:3px; }
  .timeline { position:relative; padding-left:20px; }
  .timeline::before { content:""; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background: var(--line); }
  .tl-item { position:relative; padding:0 0 15px; }
  .tl-item::before { content:""; position:absolute; left:-18px; top:3px; width:10px; height:10px; border-radius:50%; background: var(--surface); border:2px solid var(--brand-red); }
  .tl-date { font-size:11px; color: var(--fg-dim); } .tl-title { font-size:13px; font-weight:500; margin-top:1px; }
  .comment { display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); }
  .comment:last-child { border-bottom:0; }
  .comment .avatar { width:26px; height:26px; font-size:10px; }
  .comment__who { font-size:12.5px; font-weight:600; } .comment__who span { color: var(--fg-dim); font-weight:400; font-size:11px; margin-left:6px; }
  .comment__txt { font-size:13px; margin-top:2px; }

  .barrow { display:grid; grid-template-columns:120px 1fr 42px; align-items:center; gap:12px; padding:7px 0; }
  .barrow .nm { font-size:13px; font-weight:500; }
  .bartrack { background: var(--surface-2); border-radius:6px; height:22px; overflow:hidden; }
  .barfill { height:100%; background: var(--brand-red); border-radius:6px; }
  .barrow .vv { font-size:13px; font-weight:600; text-align:right; }

  /* Modal */
  .modal-sheet { position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:640px){ .modal-sheet { align-items:center; } }
  .modal-sheet__scrim { position:absolute; inset:0; background: rgba(10,10,12,.5); }
  .modal { position:relative; background: var(--surface); width:100%; max-width:580px; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0; box-shadow:0 -8px 40px rgba(0,0,0,.3); }
  @media (min-width:640px){ .modal { border-radius:14px; } }
  .modal__head { position:sticky; top:0; background: var(--surface); display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line); z-index:2; }
  .modal__head h3 { font-size:16px; } .modal__head .spacer { flex:1; }
  .modal__x { width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background: var(--surface); color: var(--fg); cursor:pointer; font-size:18px; line-height:1; }
  .modal__body { padding:16px 18px; }
  .modal__foot { position:sticky; bottom:0; background: var(--surface); display:flex; gap:10px; justify-content:flex-end; padding:14px 18px; border-top:1px solid var(--line); }
  .modal__foot .btn { flex:1; justify-content:center; } @media(min-width:640px){ .modal__foot .btn { flex:none; } }

  .form-row { margin-bottom:13px; }
  .form-row label.lbl { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .form-row input, .form-row select, .form-row textarea { width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background: var(--surface-2); color: var(--fg); font:inherit; outline:none; min-height:42px; }
  .form-row textarea { min-height:auto; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--brand-red); }
  .form-2 { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
  @media(max-width:520px){ .form-2 { grid-template-columns:1fr; } }

  .seg { display:flex; gap:0; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button { flex:1; padding:10px; background: var(--surface-2); border:0; border-right:1px solid var(--line); color: var(--fg-dim); font:inherit; font-weight:600; cursor:pointer; font-size:13px; }
  .seg button:last-child { border-right:0; }
  .seg button.on { background: var(--brand-red); color:#fff; }

  .checks { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media(max-width:520px){ .checks { grid-template-columns:1fr; } }
  .check { display:flex; align-items:center; gap:9px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background: var(--surface-2); cursor:pointer; font-size:13px; }
  .check input { width:17px; height:17px; min-height:0; accent-color: var(--brand-red); flex:none; margin:0; }
  .check.on { border-color: var(--brand-red); background: color-mix(in srgb, var(--brand-red) 7%, var(--surface)); }

  .inline-note { font-size:12px; background: var(--info-bg); border:1px solid color-mix(in srgb, var(--info) 30%, transparent); color: var(--info); padding:9px 12px; border-radius:8px; display:flex; gap:8px; align-items:flex-start; }
  .inline-note.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .section-title { font-family: var(--f-head); font-size:13px; text-transform:uppercase; letter-spacing:.05em; color: var(--fg-dim); margin:18px 0 9px; }
  .empty { text-align:center; color: var(--fg-dim); padding:30px 16px; font-size:13px; }

  .pills { display:flex; flex-wrap:wrap; gap:6px; }
  .pill { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; background: var(--surface-2); border:1px solid var(--line); color: var(--fg-dim); }

  .photos { display:flex; gap:9px; flex-wrap:wrap; }
  .photo { width:78px; height:78px; border-radius:9px; object-fit:cover; border:1px solid var(--line); background: var(--surface-2); }
  .photo-add { width:78px; height:78px; border-radius:9px; border:1.5px dashed var(--line); background: var(--surface-2); color: var(--fg-dim); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; font-size:11px; }

  .sigpad { border:1.5px dashed var(--line); border-radius:10px; background: var(--surface-2); touch-action:none; width:100%; height:150px; display:block; }
  .sig-done { border:1px solid var(--good); border-radius:10px; padding:10px; display:flex; align-items:center; gap:12px; background: var(--good-bg); }
  .sig-done img { height:60px; background:#fff; border-radius:6px; border:1px solid var(--line); }

  .toast-wrap { position:fixed; z-index:80; left:50%; transform:translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; width:calc(100% - 32px); max-width:380px; pointer-events:none; }
  .toast { background: var(--fg); color: var(--surface); padding:11px 15px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:0 6px 24px rgba(0,0,0,.3); display:flex; align-items:center; gap:9px; }
  .toast .d { width:7px; height:7px; border-radius:50%; background: var(--good); flex:none; }

  .scrim-overlay { display:none; }
  @media (max-width:860px){ .grid--2 { grid-template-columns:1fr; } .board { grid-template-columns:1fr; } }
  @media (max-width:760px){
    .rail { transform: translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.4); }
    .rail.is-open { transform: translateX(0); }
    .main { margin-left:0; }
    .hamburger { display:inline-flex; }
    .scrim-overlay.is-on { display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35; }
  }
</style>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<div class="app">
  <aside class="rail" id="rail">
    <div class="rail__brand">
      <div class="logo-mark"></div>
      <div>
        <div class="brand-name">Asset&nbsp;Track</div>
        <div class="brand-sub">Back-Office</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="rail__foot">
      <div class="viewas">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Viewing as
      </div>
      <div class="viewas-row">
        <div class="avatar" id="railAvatar">MM</div>
        <select class="uselect" id="viewAs"></select>
      </div>

        +'<div class="card__head"><h3>'+(isAdmin?'All open tasks':'My tasks')+'</h3><div class="spacer"></div><span class="badge b-neutral">'+(isAdmin?openT:myTasks.length)+'</span></div>'
        +'<div class="card__body">'+ ((isAdmin?db.tasks.filter(function(t){return t.status!=="done";}):myTasks).slice(0,6).map(function(t){
            return '<div class="alert" style="cursor:pointer" data-opentask="'+t.id+'"><span class="alert__dot" style="background:'+(isOverdue(t)?'var(--crit)':t.status==="in_progress"?'var(--warn)':'var(--info)')+'"></span>'

  var _sigClear=null;
  function clearSig(){ if(_sigClear) _sigClear(); }
  function setupSigPad(canvas, ready){
    if(!canvas) return;
    var ctx=canvas.getContext("2d");
    function resize(){ var r=canvas.getBoundingClientRect(); canvas.width=r.width*2; canvas.height=r.height*2; ctx.scale(2,2); ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.strokeStyle=getComputedStyle(document.body).color; }
    resize();
    var drawing=false, ink=false, last=null;
    function pos(e){ var r=canvas.getBoundingClientRect(); var pt=e.touches?e.touches[0]:e; return {x:pt.clientX-r.left,y:pt.clientY-r.top}; }
    function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
    function move(e){ if(!drawing)return; var p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; ink=true; e.preventDefault(); }
    function end(){ drawing=false; }
    canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
    canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false}); canvas.addEventListener("touchend",end);
    _sigClear=function(){ ctx.clearRect(0,0,canvas.width,canvas.height); ink=false; };
    ready(function(){ return ink; });
  }

  }
  function openCsvImport(){
    var body='<div class="inline-note warn" style="margin-bottom:14px"><span>⚠</span><span>LocoNav’s public developer docs don’t expose a vehicle-list or count endpoint, so we can’t auto-pull your fleet. CSV import is the reliable route.</span></div>'
      +'<div class="form-row"><label class="lbl">Client</label><select id="csv-client">'+db.clients.map(function(c){return '<option>'+esc(c.name)+'</option>';}).join('')+'</select></div>'
      +'<div class="form-row"><label class="lbl">Vehicle CSV</label><input type="file" accept=".csv" id="csv-file"></div>'
      +'<div class="inline-note"><span>ⓘ</span><span>Expected columns: registration, make/model, tracker serial, SIM number. The fleet count updates from the row count.</span></div>';
    openModal("Import vehicles", body, [
      { label:"Cancel", cls:"btn", fn:closeModal },
      { label:"Import", cls:"btn btn--primary", fn:function(){ var f=document.getElementById("csv-file"); if(!f.files||!f.files.length){ toast("Choose a CSV file first"); return; } closeModal(); toast("CSV received — vehicles parsed and linked (prototype stub)"); } }
    ]);
  }

  /* ---- Inventory ---- */
  var invTab="stock";
  function renderInventory(){
    var html='<div class="toolbar"><div class="chipset">'
      +'<button class="chip'+(invTab==="stock"?' is-on':'')+'" data-it="stock">In stock</button>'
      +'<button class="chip'+(invTab==="damages"?' is-on':'')+'" data-it="damages">Damages</button></div></div>';
    if(invTab==="stock"){
      html+='<div class="card"><div class="card__body flush"><div class="tablewrap"><table class="data"><thead><tr><th>Item</th><th>Category</th><th>In stock</th><th>Min</th><th>Status</th><th></th></tr></thead><tbody>';
      db.inventory.forEach(function(v){
        var low=v.instock<v.min;
        html+='<tr class="clickable" data-item="'+v.id+'"><td style="font-weight:600">'+esc(v.item)+'<div class="cellmuted">'+esc(v.sku)+'</div></td><td>'+esc(v.cat)+'</td><td class="tnum">'+v.instock+'</td><td class="tnum cellmuted">'+v.min+'</td><td>'+(low?'<span class="badge b-crit"><span class="d"></span>Reorder</span>':'<span class="badge b-good"><span class="d"></span>OK</span>')+'</td><td><button class="btn btn--sm" data-reorder="'+v.id+'">Reorder</button></td></tr>';
      });
      html+='</tbody></table></div></div></div><div class="inline-note" style="margin-top:14px"><span>ⓘ</span><span>Click an item to take units out of stock (logs who took them and for which client) or mark damages. Reorder emails the admin.</span></div>';
    } else {
      var dmg=db.inventory.filter(function(v){return v.damaged>0;});
      html+='<div class="card"><div class="card__body flush"><div class="tablewrap"><table class="data"><thead><tr><th>Item</th><th>Category</th><th>Damaged units</th></tr></thead><tbody>';
      if(!dmg.length) html+='<tr><td colspan="3"><div class="empty">No damaged stock recorded</div></td></tr>';
      dmg.forEach(function(v){ html+='<tr class="clickable" data-item="'+v.id+'"><td style="font-weight:600">'+esc(v.item)+'</td><td>'+esc(v.cat)+'</td><td><span class="badge b-crit">'+v.damaged+' damaged</span></td></tr>'; });
      html+='</tbody></table></div></div></div>';
    }
    view.innerHTML=html;
    view.querySelectorAll("[data-it]").forEach(function(b){ b.onclick=function(){ invTab=b.dataset.it; renderInventory(); }; });
    view.querySelectorAll("[data-item]").forEach(function(r){ r.onclick=function(e){ if(e.target.closest("[data-reorder]"))return; openItem(r.dataset.item); }; });
    view.querySelectorAll("[data-reorder]").forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); var v=db.inventory.find(function(x){return x.id===b.dataset.reorder;}); toast("Reorder request for "+v.item+" emailed to admin"); }; });
  }
  function openItem(id){
    var v=db.inventory.find(function(x){return x.id===id;}); if(!v) return;
    var last=v.moves[0];
    var body='<div class="detail-grid" style="margin-bottom:16px">'+field("SKU",v.sku)+field("Category",v.cat)+field("In stock",v.instock)+field("Minimum",v.min)+field("Damaged",v.damaged)
      +'<div class="field"><label>Last taken by</label><div class="v">'+(last?esc(last.who)+' → '+esc(last.client):'—')+'</div></div></div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><button class="btn btn--sm btn--primary" id="it-take">Take out of stock</button><button class="btn btn--sm btn--danger" id="it-dmg">Mark damaged</button><button class="btn btn--sm" id="it-reorder">Reorder</button></div>'
      +'<div class="section-title">Stock movements</div>'
      +'<div class="tablewrap"><table class="data" style="min-width:auto"><thead><tr><th>Date</th><th>Qty</th><th>By</th><th>Client</th><th>Purpose</th></tr></thead><tbody>'
      + (v.moves.length? v.moves.map(function(m){ return '<tr><td>'+esc(m.date)+'</td><td class="tnum">'+(m.dir==="damage"?'−':'−')+m.qty+'</td><td>'+esc(m.who)+'</td><td>'+esc(m.client||"—")+'</td><td>'+esc(m.purpose)+'</td></tr>'; }).join('') : '<tr><td colspan="5"><div class="empty">No movements yet</div></td></tr>') +'</tbody></table></div>';
    openModal(v.item, body, [{ label:"Close", cls:"btn btn--primary", fn:closeModal }]);
    document.getElementById("it-take").onclick=function(){ openTakeStock(v); };
    document.getElementById("it-dmg").onclick=function(){ openDamage(v); };
    document.getElementById("it-reorder").onclick=function(){ toast("Reorder request for "+v.item+" emailed to admin"); };
  }
  function openTakeStock(v){
    var body='<div class="form-2"><div class="form-row"><label class="lbl">Quantity</label><input id="ts-qty" type="number" min="1" value="1"></div>'
      +'<div class="form-row"><label class="lbl">Taken by</label><select id="ts-who">'+db.users.map(function(u){return '<option value="'+u.init+'"'+(u.id===db.currentUser?' selected':'')+'>'+esc(u.name+" "+u.surname)+'</option>';}).join('')+'</select></div></div>'
      +'<div class="form-row"><label class="lbl">For client</label><select id="ts-client">'+db.clients.map(function(c){return '<option>'+esc(c.name)+'</option>';}).join('')+'</select></div>'
      +'<div class="form-row"><label class="lbl">Purpose</label><select id="ts-purpose"><option>Install</option><option>Swap</option><option>Replacement</option><option>Repair</option></select></div>'
      +'<div class="inline-note"><span>ⓘ</span><span>This logs who took the units and which client they went to, and reduces stock on hand.</span></div>';
    openModal("Take out of stock — "+v.item, body, [
      { label:"Cancel", cls:"btn", fn:closeModal },
      { label:"Confirm", cls:"btn btn--primary", fn:function(){
          var qty=parseInt(document.getElementById("ts-qty").value||"0",10); if(qty<1){ toast("Enter a quantity"); return; }
          if(qty>v.instock){ toast("Only "+v.instock+" in stock"); return; }
          var forClient=document.getElementById("ts-client").value;
          v.instock-=qty; v.moves.unshift({ who:document.getElementById("ts-who").value, client:forClient, qty:qty, purpose:document.getElementById("ts-purpose").value, date:"Today", dir:"out" });
          save(); closeModal(); toast(qty+" × "+v.sku+" taken out for "+forClient); openItem(v.id); renderInventory();
        } }
    ]);
  }
  function openDamage(v){
    var body='<div class="form-2"><div class="form-row"><label class="lbl">Quantity</label><input id="dm-qty" type="number" min="1" value="1"></div><div class="form-row"><label class="lbl">Reported by</label><select id="dm-who">'+db.users.map(function(u){return '<option value="'+u.init+'"'+(u.id===db.currentUser?' selected':'')+'>'+esc(u.name+" "+u.surname)+'</option>';}).join('')+'</select></div></div>'
      +'<div class="form-row"><label class="lbl">Note</label><input id="dm-note" placeholder="e.g. water damage, dropped unit"></div>';
    openModal("Mark damaged — "+v.item, body, [
      { label:"Cancel", cls:"btn", fn:closeModal },
      { label:"Record damage", cls:"btn btn--danger", fn:function(){
          var qty=parseInt(document.getElementById("dm-qty").value||"0",10); if(qty<1){ toast("Enter a quantity"); return; }
          if(qty>v.instock){ toast("Only "+v.instock+" in stock"); return; }
          v.instock-=qty; v.damaged+=qty; v.moves.unshift({ who:document.getElementById("dm-who").value, client:"—", qty:qty, purpose:"Damaged: "+(document.getElementById("dm-note").value||"no note"), date:"Today", dir:"damage" });
          save(); closeModal(); toast(qty+" × "+v.sku+" moved to damages"); openItem(v.id); renderInventory();
        } }
    ]);
  }
  var INV_CATS=["Tracker","Sensor","Dash cam","SD card","Fuel sensor","Harness","SIM","Consumable"];
  function openItemForm(){
    var body='<div class="form-row"><label class="lbl">Item name</label><input id="if-name" placeholder="e.g. Teltonika FMB920 GPS tracker"></div>'
      +'<div class="form-2"><div class="form-row"><label class="lbl">SKU</label><input id="if-sku" placeholder="e.g. FMB920"></div><div class="form-row"><label class="lbl">Category</label><select id="if-cat">'+INV_CATS.map(function(c){return '<option>'+esc(c)+'</option>';}).join('')+'</select></div></div>'
      +'<div class="form-2"><div class="form-row"><label class="lbl">Opening stock</label><input id="if-stock" type="number" min="0" value="0"></div><div class="form-row"><label class="lbl">Minimum level</label><input id="if-min" type="number" min="0" value="5"></div></div>';
    openModal("Add inventory item", body, [
      { label:"Cancel", cls:"btn", fn:closeModal },
      { label:"Add item", cls:"btn btn--primary", fn:function(){
          var name=document.getElementById("if-name").value.trim(); if(!name){ toast("Enter an item name"); return; }
          db.inventory.push({ id:uid("v"), item:name, sku:document.getElementById("if-sku").value||"—", cat:document.getElementById("if-cat").value, instock:parseInt(document.getElementById("if-stock").value||"0",10), min:parseInt(document.getElementById("if-min").value||"0",10), damaged:0, moves:[] });
          save(); closeModal(); toast("Item added to inventory"); renderInventory();
        } }
    ]);
  }

  /* ---- SIMs ---- */
  function renderSims(){
    var off=db.sims.filter(function(s){return s.status==="offline";}).length;
    var html='';
    if(off) html+='<div class="inline-note" style="margin-bottom:14px;color:var(--crit);background:var(--crit-bg);border-color:color-mix(in srgb,var(--crit) 30%,transparent)"><span>⚠</span><span>'+off+' SIM'+(off===1?'':'s')+' offline. Create a diagnostic task from the row.</span></div>';
    html+='<div class="inline-note" style="margin-bottom:14px"><span>ⓘ</span><span>Paste your SIM portal API doc and we’ll wire live status, data usage and auto-tasks here.</span></div>';
    html+='<div class="card"><div class="card__body flush"><div class="tablewrap"><table class="data"><thead><tr><th>ICCID</th><th>Vehicle</th><th>Client</th><th>Network</th><th>Last seen</th><th>Data</th><th>Status</th><th></th></tr></thead><tbody>';
    db.sims.forEach(function(s){
      html+='<tr><td class="tnum cellmuted">'+esc(s.iccid)+'</td><td style="font-weight:600">'+esc(s.vehicle)+'</td><td>'+esc(s.client)+'</td><td>'+esc(s.net)+'</td><td class="tnum">'+esc(s.lastseen)+'</td><td class="tnum">'+esc(s.data)+'</td><td>'+simBadge(s.status)+'</td><td>'+(s.status==="offline"?'<button class="btn btn--sm" data-simtask="'+s.id+'">Create task</button>':'')+'</td></tr>';
    });
    html+='</tbody></table></div></div></div>';
    view.innerHTML=html;
    view.querySelectorAll("[data-simtask]").forEach(function(b){ b.onclick=function(){ var s=db.sims.find(function(x){return x.id===b.dataset.simtask;}); quickOfflineTask(s); }; });
  }

  /* ---- Reports ---- */
  function renderReports(){
    var perTech=db.users.filter(function(u){return u.role==="technician";}).map(function(t){
      var inst=db.installs.filter(function(i){return i.tech===t.id&&i.status==="completed";}).length+(t.id==="t1"?6:t.id==="t2"?4:3);
      var tasks=db.tasks.filter(function(k){return k.tech===t.id;}).length+(t.id==="t1"?9:t.id==="t2"?7:5);
      return { name:t.name, inst:inst, tasks:tasks };
    });
    var maxInst=Math.max.apply(null,perTech.map(function(p){return p.inst;}));
    var maxTask=Math.max.apply(null,perTech.map(function(p){return p.tasks;}));
    var months=[["Jul",14],["Aug",17],["Sep",13],["Oct",21],["Nov",8]]; var maxM=Math.max.apply(null,months.map(function(m){return m[1];}));
    var html='<div class="grid grid--2">'
      +'<div class="card"><div class="card__head"><h3>Installations per technician</h3><div class="spacer"></div><span class="cellmuted">This month</span></div><div class="card__body">'
      +perTech.map(function(p){var w=Math.round(p.inst/maxInst*100);return '<div class="barrow"><div class="nm">'+esc(p.name)+'</div><div class="bartrack"><div class="barfill" style="width:'+w+'%"></div></div><div class="vv tnum">'+p.inst+'</div></div>';}).join('')+'</div></div>'
      +'<div class="card"><div class="card__head"><h3>Tasks closed per technician</h3></div><div class="card__body">'
      +perTech.map(function(p){var w=Math.round(p.tasks/maxTask*100);return '<div class="barrow"><div class="nm">'+esc(p.name)+'</div><div class="bartrack"><div class="barfill" style="width:'+w+'%;background:var(--info)"></div></div><div class="vv tnum">'+p.tasks+'</div></div>';}).join('')+'</div></div></div>'
      +'<div class="card" style="margin-top:16px"><div class="card__head"><h3>Installations by month</h3><div class="spacer"></div><span class="cellmuted">Nov month-to-date</span></div><div class="card__body"><div style="display:flex;align-items:flex-end;gap:16px;height:160px;padding:10px 4px">'
      +months.map(function(m){var h=Math.round(m[1]/maxM*130);return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px"><div class="tnum" style="font-size:12px;font-weight:600">'+m[1]+'</div><div style="width:100%;max-width:46px;height:'+h+'px;background:var(--brand-red);border-radius:6px 6px 0 0"></div><div class="cellmuted">'+m[0]+'</div></div>';}).join('')+'</div></div></div>'
      +'<div class="inline-note" style="margin-top:14px"><span>ⓘ</span><span>Reports are a placeholder — we’ll finalise these once the rest of the system is locked. Figures mix live prototype records with seeded history.</span></div>';
    view.innerHTML=html;
  }

  /* ---- Team ---- */
  function renderTeam(){
    var html='<div class="card"><div class="card__body flush"><div class="tablewrap"><table class="data"><thead><tr><th>Name</th><th>Role</th><th>Access</th><th></th></tr></thead><tbody>';
    db.users.forEach(function(u){
      html+='<tr><td><div style="display:flex;align-items:center;gap:10px"><span class="avatar" style="width:30px;height:30px">'+esc(u.init)+'</span><div><div style="font-weight:600">'+esc(u.name+" "+u.surname)+'</div></div></div></td>'
        +'<td>'+(u.role==="admin"?'<span class="badge b-info">Admin</span>':'<span class="badge b-neutral">Technician</span>')+'</td>'
        +'<td><div class="pills">'+(u.role==="admin"?'<span class="pill">Full access</span>':u.perms.map(function(p){var m=MODULES.find(function(x){return x.id===p;});return '<span class="pill">'+esc(m?m.label:p)+'</span>';}).join(''))+'</div></td>'
        +'<td>'+(u.role==="admin"?'':'<button class="btn btn--sm" data-edituser="'+u.id+'">Edit</button>')+'</td></tr>';
    });
    html+='</tbody></table></div></div></div><div class="inline-note" style="margin-top:14px"><span>ⓘ</span><span>Use the “Viewing as” switch at the bottom-left to see the system through any user’s permissions.</span></div>';
    view.innerHTML=html;
    view.querySelectorAll("[data-edituser]").forEach(function(b){ b.onclick=function(){ openUserForm(b.dataset.edituser); }; });
  }
  function openUserForm(id){
    var u = id ? user(id) : null;
    var editable=MODULES.filter(function(m){return m.id!=="team";});
    var body='<div class="form-2"><div class="form-row"><label class="lbl">First name</label><input id="uf-name" value="'+esc(u?u.name:'')+'"></div><div class="form-row"><label class="lbl">Surname</label><input id="uf-surname" value="'+esc(u?u.surname:'')+'"></div></div>'
      +'<div class="form-row"><label class="lbl">Role</label><select id="uf-role"><option value="technician"'+(!u||u.role==="technician"?' selected':'')+'>Technician</option><option value="admin"'+(u&&u.role==="admin"?' selected':'')+'>Admin (full access)</option></select></div>'
      +'<div class="form-row" id="uf-permsrow"><label class="lbl">What they can access</label><div class="checks" id="uf-perms">'+editable.map(function(m){var on=u?u.perms.indexOf(m.id)>=0:(m.id==="dashboard"||m.id==="tasks"||m.id==="installs");return '<label class="check"><input type="checkbox" value="'+m.id+'"'+(on?' checked':'')+'><span>'+esc(m.label)+'</span></label>';}).join('')+'</div></div>'
      +'<div class="inline-note"><span>ⓘ</span><span>Technicians only see the modules you tick. Admins get everything, including Team.</span></div>';
    openModal(u?"Edit user":"New user", body, [
      { label:"Cancel", cls:"btn", fn:closeModal },
      { label:u?"Save":"Create user", cls:"btn btn--primary", fn:function(){
          var name=document.getElementById("uf-name").value.trim(); var sur=document.getElementById("uf-surname").value.trim();
          if(!name){ toast("Enter a first name"); return; }
          var role=document.getElementById("uf-role").value;
          var perms = role==="admin" ? ALL_PERMS.slice() : Array.prototype.slice.call(document.querySelectorAll("#uf-perms input:checked")).map(function(x){return x.value;});
          var init=(name[0]||"")+(sur[0]||""); init=init.toUpperCase()||"U";
          if(u){ u.name=name; u.surname=sur; u.role=role; u.perms=perms; u.init=init; toast("User updated"); }
          else { db.users.push({ id:uid("u"), name:name, surname:sur, init:init, role:role, perms:perms }); toast("User created · invite email sent"); }
          save(); renderViewAs(); renderNav(); closeModal(); renderTeam();
        } }
    ]);
    syncChecks("uf-perms");
    var roleSel=document.getElementById("uf-role");
    roleSel.onchange=function(){ document.getElementById("uf-permsrow").style.display = roleSel.value==="admin" ? "none" : ""; };
    roleSel.onchange();
  }
  function syncChecks(wrapId){
    var wrap=document.getElementById(wrapId); if(!wrap) return;
    wrap.querySelectorAll(".check").forEach(function(l){ var inp=l.querySelector("input"); function up(){ l.classList.toggle("on",inp.checked); } inp.addEventListener("change",up); up(); });
  }

  /* Modal */
  var modalEl=null;
  function openModal(title, bodyHtml, actions){
    closeModal(); _sigClear=null;
    modalEl=document.createElement("div"); modalEl.className="modal-sheet";
    modalEl.innerHTML='<div class="modal-sheet__scrim"></div><div class="modal" role="dialog" aria-modal="true"><div class="modal__head"><h3>'+esc(title)+'</h3><div class="spacer"></div><button class="modal__x" aria-label="Close">×</button></div><div class="modal__body">'+bodyHtml+'</div><div class="modal__foot"></div></div>';
    document.body.appendChild(modalEl);
    var foot=modalEl.querySelector(".modal__foot");
    (actions||[]).forEach(function(a){ var b=document.createElement("button"); b.className=a.cls; b.textContent=a.label; b.onclick=a.fn; foot.appendChild(b); });
    modalEl.querySelector(".modal-sheet__scrim").onclick=closeModal;
    modalEl.querySelector(".modal__x").onclick=closeModal;
    document.body.style.overflow="hidden";
  }
  function closeModal(){ if(modalEl){ modalEl.remove(); modalEl=null; document.body.style.overflow=""; } }
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });

  /* Rail (mobile) */
  function openRail(){ document.getElementById("rail").classList.add("is-open"); document.getElementById("scrim").classList.add("is-on"); }
  function closeRail(){ document.getElementById("rail").classList.remove("is-open"); document.getElementById("scrim").classList.remove("is-on"); }
  document.getElementById("burger").onclick=openRail;
  document.getElementById("scrim").onclick=closeRail;

  /* View-as */
  document.getElementById("viewAs").onchange=function(){ db.currentUser=this.value; save(); renderViewAs(); if(!can(route)) route=cur().perms[0]||"dashboard"; go(route); toast("Now viewing as "+uName(db.currentUser)); };

  /* Boot */
  document.getElementById("nav").addEventListener("click",function(e){ var b=e.target.closest("[data-nav]"); if(b) go(b.dataset.nav); });
  renderViewAs(); renderNav(); go("dashboard");
})();
</script>
