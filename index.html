<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asset Track Back-Office</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<style>
  :root {
    --brand-red: #e31e24; --brand-red-ink: #b3161b;
    --rail: #2b2b2e; --rail-ink: #e9e9ec; --rail-dim: #9a9aa2; --rail-line: #3c3c40;
    --bg: #ececed; --surface: #ffffff; --surface-2: #f6f6f7; --fg: #26262a; --fg-dim: #6c6c74; --line: #dddde1;
    --good: #1f9254; --good-bg: #e4f3ea; --warn: #b7791f; --warn-bg: #fbf1dd; --crit: #d1232a; --crit-bg: #fbe6e7; --info: #2563a8; --info-bg: #e5eef8;
    --radius: 10px; --shadow: 0 1px 2px rgba(20,20,25,.06), 0 2px 10px rgba(20,20,25,.05);
    --f-head: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; --f-body: "Inter", ui-sans-serif, system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --rail: #202023; --rail-ink: #e9e9ec; --rail-dim: #8f8f98; --rail-line: #333337;
    --bg: #161618; --surface: #1f1f22; --surface-2: #27272b; --fg: #e7e7ea; --fg-dim: #9a9aa3; --line: #34343a;
    --good: #4ac07e; --good-bg: #163024; --warn: #e0a84a; --warn-bg: #3a2e14; --crit: #f06a6f; --crit-bg: #3a1a1c; --info: #6ba6e6; --info-bg: #15293f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.28); color-scheme: dark;
  } }
  :root[data-theme="dark"] {
    --rail: #202023; --rail-ink: #e9e9ec; --rail-dim: #8f8f98; --rail-line: #333337;
    --bg: #161618; --surface: #1f1f22; --surface-2: #27272b; --fg: #e7e7ea; --fg-dim: #9a9aa3; --line: #34343a;
    --good: #4ac07e; --good-bg: #163024; --warn: #e0a84a; --warn-bg: #3a2e14; --crit: #f06a6f; --crit-bg: #3a1a1c; --info: #6ba6e6; --info-bg: #15293f;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 10px rgba(0,0,0,.28); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1,h2,h3,h4 { font-family: var(--f-head); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
  button { font-family: inherit; }
  .tnum { font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  .app { display: flex; min-height: 100%; }
  .rail { position: fixed; top:0; bottom:0; left:0; width: 236px; z-index: 40; background: var(--rail); color: var(--rail-ink); display:flex; flex-direction:column; transition: transform .22s ease; }
  .rail__brand { display:flex; flex-direction:column; align-items:center; gap:7px; padding: 16px 16px 14px; border-bottom:1px solid var(--rail-line); }
  .rail__logo { width:100%; max-width:176px; height:auto; display:block; background:#fff; padding:9px 13px; border-radius:10px; box-sizing:border-box; }
  .rail__tag { font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--rail-dim); }
  .logo-mark { width:30px; height:30px; border-radius:7px; background: var(--brand-red); position:relative; flex:none; }
  .logo-mark::after { content:""; position:absolute; inset:9px; border:2.5px solid #fff; border-radius:50%; }
  .logo-mark::before { content:""; position:absolute; left:50%; top:50%; width:2.5px; height:9px; background:#fff; transform: translate(-50%,-100%); }
  .brand-name { font-family: var(--f-head); font-weight:700; font-size:15px; line-height:1.05; letter-spacing:-.02em; }
  .brand-sub { font-size:10.5px; color: var(--rail-dim); letter-spacing:.06em; text-transform:uppercase; }
  .nav { flex:1; overflow-y:auto; padding: 10px 10px 16px; }
  .nav__label { font-size:10px; letter-spacing:.09em; text-transform:uppercase; color: var(--rail-dim); padding: 12px 10px 5px; }
  .nav__item { display:flex; align-items:center; gap:11px; width:100%; padding: 10px 11px; margin:1px 0; border:0; border-radius:8px; background:transparent; color: var(--rail-ink); cursor:pointer; font-size:13.5px; text-align:left; border-left:3px solid transparent; }
  .nav__item:hover { background: rgba(255,255,255,.05); }
  .nav__item.is-active { background: rgba(227,30,36,.14); border-left-color: var(--brand-red); color:#fff; font-weight:500; }
  .nav__item .ico { width:18px; height:18px; flex:none; opacity:.92; }
  .nav__item .ct { margin-left:auto; font-size:11px; background: rgba(255,255,255,.1); color: var(--rail-ink); padding:1px 7px; border-radius:20px; min-width:20px; text-align:center; }
  .nav__item.is-active .ct { background: var(--brand-red); color:#fff; }
  .rail__foot { border-top:1px solid var(--rail-line); padding: 12px 14px; display:flex; align-items:center; gap:10px; }
  .avatar { width:30px; height:30px; border-radius:50%; background: var(--brand-red); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:12px; flex:none; font-family: var(--f-head); }
  .rail__foot .who { font-size:12.5px; font-weight:500; line-height:1.15; }
  .rail__foot .role { font-size:10.5px; color: var(--rail-dim); }
  .signout { margin-left:auto; background:transparent; border:1px solid var(--rail-line); color:var(--rail-dim); border-radius:7px; padding:6px 8px; cursor:pointer; font-size:11px; }
  .signout:hover { color:#fff; border-color:var(--rail-dim); }

  .main { flex:1; min-width:0; margin-left:236px; display:flex; flex-direction:column; }
  .topbar { position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom:1px solid var(--line); padding: 11px 20px; }
  .hamburger { display:none; width:40px; height:40px; border-radius:8px; border:1px solid var(--line); background: var(--surface); color: var(--fg); cursor:pointer; flex:none; align-items:center; justify-content:center; }
  .topbar h1 { font-size:17px; }
  .topbar .crumb { font-size:11.5px; color: var(--fg-dim); letter-spacing:.04em; text-transform:uppercase; }
  .topbar .spacer { flex:1; }
  .btn { display:inline-flex; align-items:center; gap:7px; cursor:pointer; border-radius:8px; border:1px solid var(--line); background: var(--surface); color: var(--fg); padding:9px 13px; font-size:13px; font-weight:500; white-space:nowrap; min-height:40px; }
  .btn:hover { background: var(--surface-2); }
  .btn--primary { background: var(--brand-red); border-color: var(--brand-red); color:#fff; }
  .btn--primary:hover { background: var(--brand-red-ink); }
  .btn--danger { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); background: var(--crit-bg); }
  .btn .ico { width:16px; height:16px; }
  .btn--sm { padding:7px 10px; font-size:12px; min-height:34px; }
  .btn[disabled] { opacity:.6; cursor:default; }

  .view { padding:20px; padding-bottom: 40px; max-width:1180px; width:100%; }
  .kpis { display:grid; grid-template-columns: repeat(auto-fit, minmax(158px,1fr)); gap:12px; margin-bottom:18px; }
  .kpi { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding:14px 15px; box-shadow: var(--shadow); }
  .kpi__label { font-size:11.5px; color: var(--fg-dim); text-transform:uppercase; letter-spacing:.05em; }
  .kpi__val { font-family: var(--f-head); font-size:27px; font-weight:600; margin-top:7px; line-height:1; letter-spacing:-.02em; }
  .kpi__val small { font-size:14px; color: var(--fg-dim); font-weight:500; }
  .kpi__meta { font-size:11.5px; margin-top:6px; color: var(--fg-dim); }
  .kpi__meta.up { color: var(--good); } .kpi__meta.down { color: var(--crit); }
  .kpi.accent { border-top:3px solid var(--brand-red); }
  .kpi--link { cursor:pointer; transition:border-color .12s, transform .12s; }
  .kpi--link:hover { border-color:var(--brand-red); transform:translateY(-1px); }

  .grid { display:grid; gap:16px; } .grid--2 { grid-template-columns: 1.4fr 1fr; }
  .card { background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow:hidden; }
  .card__head { display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--line); }
  .card__head h3 { font-size:14.5px; } .card__head .spacer { flex:1; }
  .card__head .link { font-size:12px; color: var(--brand-red); background:none; border:0; cursor:pointer; font-weight:500; }
  .card__body { padding:6px 16px 14px; } .card__body.flush { padding:0; }

  .alert { display:flex; gap:11px; padding:11px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
  .alert:last-child { border-bottom:0; }
  .alert__dot { width:9px; height:9px; border-radius:50%; margin-top:5px; flex:none; }
  .alert__body { flex:1; min-width:0; }
  .alert__title { font-size:13px; font-weight:500; } .alert__meta { font-size:11.5px; color: var(--fg-dim); margin-top:2px; }
  .alert__act { font-size:12px; color: var(--brand-red); background:none; border:0; cursor:pointer; font-weight:500; padding:4px 0; flex:none; }

  .badge { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 9px; border-radius:20px; white-space:nowrap; }
  .badge .d { width:6px; height:6px; border-radius:50%; background: currentColor; }
  .b-good { color: var(--good); background: var(--good-bg); } .b-warn { color: var(--warn); background: var(--warn-bg); }
  .b-crit { color: var(--crit); background: var(--crit-bg); } .b-info { color: var(--info); background: var(--info-bg); } .b-neutral { color: var(--fg-dim); background: var(--surface-2); }
  .prio-urgent { color:#fff; background: var(--brand-red); } .prio-high { color: var(--crit); background: var(--crit-bg); }
  .prio-medium { color: var(--warn); background: var(--warn-bg); } .prio-low { color: var(--fg-dim); background: var(--surface-2); }

  .tablewrap { overflow-x:auto; }
  table.data { width:100%; border-collapse:collapse; font-size:13px; min-width:560px; }
  table.data th { text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color: var(--fg-dim); font-weight:600; padding:10px 14px; border-bottom:1px solid var(--line); background: var(--surface-2); position:sticky; top:0; }
  table.data td { padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
  table.data tr:last-child td { border-bottom:0; }
  table.data tr.clickable { cursor:pointer; } table.data tr.clickable:hover td { background: var(--surface-2); }
  .cellmuted { color: var(--fg-dim); font-size:12px; }

  .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .chipset { display:flex; gap:6px; flex-wrap:wrap; } .toolbar .spacer { flex:1; }
  .chip { font-size:12.5px; padding:8px 13px; border-radius:20px; border:1px solid var(--line); background: var(--surface); color: var(--fg-dim); cursor:pointer; font-weight:500; }
  .chip.is-on { background: var(--fg); color: var(--surface); border-color: var(--fg); }

  .board { display:grid; grid-template-columns: repeat(3, minmax(230px,1fr)); gap:12px; }
  .board__col { background: var(--surface-2); border:1px solid var(--line); border-radius: var(--radius); display:flex; flex-direction:column; min-height:120px; }
  .board__colhead { padding:10px 13px; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
  .board__colhead .n { margin-left:auto; background: var(--surface); border:1px solid var(--line); border-radius:20px; padding:0 8px; font-size:11px; }
  .board__list { padding:10px; display:flex; flex-direction:column; gap:9px; }
  .jobcard { background: var(--surface); border:1px solid var(--line); border-radius:9px; padding:11px; cursor:pointer; box-shadow: var(--shadow); }
  .jobcard:hover { border-color: var(--brand-red); }
  .jobcard__ref { font-size:10.5px; color: var(--fg-dim); font-family: var(--f-head); letter-spacing:.03em; }
  .jobcard__client { font-size:13.5px; font-weight:600; margin:2px 0 4px; }
  .jobcard__row { font-size:12px; color: var(--fg-dim); display:flex; align-items:center; gap:6px; }
  .jobcard__foot { display:flex; align-items:center; gap:8px; margin-top:8px; }

  .detail-grid { display:grid; grid-template-columns: repeat(auto-fit,minmax(170px,1fr)); gap:14px; }
  .field label { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color: var(--fg-dim); } .field .v { font-size:14px; font-weight:500; margin-top:3px; }
  .timeline { position:relative; padding-left:20px; } .timeline::before { content:""; position:absolute; left:5px; top:4px; bottom:4px; width:2px; background: var(--line); }
  .tl-item { position:relative; padding:0 0 15px; } .tl-item::before { content:""; position:absolute; left:-18px; top:3px; width:10px; height:10px; border-radius:50%; background: var(--surface); border:2px solid var(--brand-red); }
  .tl-date { font-size:11px; color: var(--fg-dim); } .tl-title { font-size:13px; font-weight:500; margin-top:1px; }
  .comment { display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--line); } .comment:last-child { border-bottom:0; }
  .comment .avatar { width:26px; height:26px; font-size:10px; }
  .comment__who { font-size:12.5px; font-weight:600; } .comment__who span { color: var(--fg-dim); font-weight:400; font-size:11px; margin-left:6px; }
  .comment__txt { font-size:13px; margin-top:2px; }

  .barrow { display:grid; grid-template-columns:120px 1fr 42px; align-items:center; gap:12px; padding:7px 0; }
  .barrow .nm { font-size:13px; font-weight:500; } .bartrack { background: var(--surface-2); border-radius:6px; height:22px; overflow:hidden; } .barfill { height:100%; background: var(--brand-red); border-radius:6px; } .barrow .vv { font-size:13px; font-weight:600; text-align:right; }

  .modal-sheet { position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center; }
  @media (min-width:640px){ .modal-sheet { align-items:center; } }
  .modal-sheet__scrim { position:absolute; inset:0; background: rgba(10,10,12,.5); }
  .modal { position:relative; background: var(--surface); width:100%; max-width:580px; max-height:92vh; overflow-y:auto; border-radius:16px 16px 0 0; box-shadow:0 -8px 40px rgba(0,0,0,.3); }
  @media (min-width:640px){ .modal { border-radius:14px; } }
  .modal__head { position:sticky; top:0; background: var(--surface); display:flex; align-items:center; gap:10px; padding:16px 18px; border-bottom:1px solid var(--line); z-index:2; }
  .modal__head h3 { font-size:16px; } .modal__head .spacer { flex:1; }
  .modal__x { width:36px; height:36px; border-radius:8px; border:1px solid var(--line); background: var(--surface); color: var(--fg); cursor:pointer; font-size:18px; line-height:1; }
  .modal__body { padding:16px 18px; }
  .modal__foot { position:sticky; bottom:0; background: var(--surface); display:flex; gap:10px; justify-content:flex-end; padding:14px 18px; border-top:1px solid var(--line); }
  .modal__foot .btn { flex:1; justify-content:center; } @media(min-width:640px){ .modal__foot .btn { flex:none; } }

  .form-row { margin-bottom:13px; } .form-row label.lbl { display:block; font-size:12px; font-weight:600; margin-bottom:5px; }
  .form-row input, .form-row select, .form-row textarea { width:100%; padding:10px 11px; border:1px solid var(--line); border-radius:8px; background: var(--surface-2); color: var(--fg); font:inherit; outline:none; min-height:42px; }
  .form-row textarea { min-height:auto; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--brand-red); }
  .form-2 { display:grid; grid-template-columns:1fr 1fr; gap:11px; } @media(max-width:520px){ .form-2 { grid-template-columns:1fr; } }
  .seg { display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button { flex:1; padding:10px; background: var(--surface-2); border:0; border-right:1px solid var(--line); color: var(--fg-dim); font:inherit; font-weight:600; cursor:pointer; font-size:13px; }
  .seg button:last-child { border-right:0; } .seg button.on { background: var(--brand-red); color:#fff; }
  .checks { display:grid; grid-template-columns:1fr 1fr; gap:8px; } @media(max-width:520px){ .checks { grid-template-columns:1fr; } }
  .check { display:flex; align-items:center; gap:9px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background: var(--surface-2); cursor:pointer; font-size:13px; }
  .check input { width:17px; height:17px; min-height:0; accent-color: var(--brand-red); flex:none; margin:0; }
  .check.on { border-color: var(--brand-red); background: color-mix(in srgb, var(--brand-red) 7%, var(--surface)); }
  .inline-note { font-size:12px; background: var(--info-bg); border:1px solid color-mix(in srgb, var(--info) 30%, transparent); color: var(--info); padding:9px 12px; border-radius:8px; display:flex; gap:8px; align-items:flex-start; }
  .inline-note.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
  .section-title { font-family: var(--f-head); font-size:13px; text-transform:uppercase; letter-spacing:.05em; color: var(--fg-dim); margin:18px 0 9px; }
  .empty { text-align:center; color: var(--fg-dim); padding:30px 16px; font-size:13px; }
  .pills { display:flex; flex-wrap:wrap; gap:6px; } .pill { font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:20px; background: var(--surface-2); border:1px solid var(--line); color: var(--fg-dim); }
  .photos { display:flex; gap:9px; flex-wrap:wrap; }
  .photo { width:78px; height:78px; border-radius:9px; object-fit:cover; border:1px solid var(--line); background: var(--surface-2); }
  .photo-add { width:78px; height:78px; border-radius:9px; border:1.5px dashed var(--line); background: var(--surface-2); color: var(--fg-dim); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; font-size:11px; }
  .sigpad { border:1.5px dashed var(--line); border-radius:10px; background: var(--surface-2); touch-action:none; width:100%; height:150px; display:block; }
  .sig-done { border:1px solid var(--good); border-radius:10px; padding:10px; display:flex; align-items:center; gap:12px; background: var(--good-bg); }

  .toast-wrap { position:fixed; z-index:80; left:50%; transform:translateX(-50%); bottom:20px; display:flex; flex-direction:column; gap:8px; width:calc(100% - 32px); max-width:380px; pointer-events:none; }
  .toast { background: var(--fg); color: var(--surface); padding:11px 15px; border-radius:10px; font-size:13px; font-weight:500; box-shadow:0 6px 24px rgba(0,0,0,.3); display:flex; align-items:center; gap:9px; }
  .toast .d { width:7px; height:7px; border-radius:50%; background: var(--good); flex:none; }

  /* Login */
  .login { position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; background: var(--bg); padding:20px; }
  .login__card { width:100%; max-width:360px; background: var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow: var(--shadow); padding:28px 24px; }
  .login__brand { display:flex; align-items:center; gap:11px; margin-bottom:22px; }
  .login__logo { background:#fff; border-radius:12px; padding:16px 18px; margin-bottom:20px; display:flex; justify-content:center; border:1px solid var(--line); }
  .login__logo img { width:100%; max-width:220px; height:auto; display:block; }
  .login h2 { font-size:18px; } .login .sub { font-size:12px; color:var(--fg-dim); }
  .login__err { font-size:12.5px; color:var(--crit); background:var(--crit-bg); border:1px solid color-mix(in srgb,var(--crit) 30%,transparent); border-radius:8px; padding:9px 11px; margin-bottom:12px; }
  .login__boot { position:fixed; inset:0; z-index:95; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--fg-dim); font-size:13px; }

  .scrim-overlay { display:none; }
  @media (max-width:860px){ .grid--2 { grid-template-columns:1fr; } .board { grid-template-columns:1fr; } }
  @media (max-width:760px){
    .rail { transform: translateX(-100%); box-shadow:0 0 40px rgba(0,0,0,.4); } .rail.is-open { transform: translateX(0); }
    .main { margin-left:0; } .hamburger { display:inline-flex; }
    .scrim-overlay.is-on { display:block; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:35; }
  }
  /* Phones: turn data tables into stacked cards (no sideways scroll) */
  @media (max-width:600px){
    .tablewrap { overflow-x:visible; }
    table.data { min-width:0; display:block; font-size:13.5px; }
    table.data thead { display:none; }
    table.data tbody, table.data tr, table.data td { display:block; width:auto; }
    table.data tr { border:1px solid var(--line); border-radius:12px; margin:0 0 10px; padding:3px 0; background:var(--surface); }
    table.data tr:last-child { margin-bottom:0; }
    table.data tr.clickable:hover td { background:transparent; }
    table.data td { border:0; border-bottom:1px solid var(--line); padding:9px 14px; display:flex; align-items:center; justify-content:space-between; gap:14px; text-align:right; overflow-wrap:anywhere; }
    table.data tr td:last-child { border-bottom:0; }
    table.data td::before { content:attr(data-label); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--fg-dim); font-weight:600; text-align:left; flex:0 0 auto; }
    table.data td:first-child { flex-direction:column; align-items:stretch; text-align:left; gap:3px; padding-top:11px; }
    table.data td:first-child > div { text-align:left; }
    table.data td[colspan]{ justify-content:center; } table.data td[colspan]::before{ display:none; }
    table.data td .pills { justify-content:flex-end; }
  }
</style>

<body>

<div class="login" id="login" hidden>
  <form class="login__card" id="loginForm">
    <div class="login__logo"><img src="/img/logo.png" alt="Asset Track"></div>
    <h2>Sign in</h2>
    <div class="sub" style="margin-bottom:18px">Enter your username and password.</div>
    <div class="login__err" id="loginErr" hidden></div>
    <div class="form-row"><label class="lbl">Username</label><input id="loginUser" autocomplete="username" placeholder="e.g. mrtiger" autocapitalize="off" autocorrect="off"></div>
    <div class="form-row"><label class="lbl">Password</label><input id="loginPass" type="password" autocomplete="current-password" placeholder="Your password"></div>
    <button class="btn btn--primary" id="loginBtn" type="submit" style="width:100%;justify-content:center;margin-top:6px">Sign in</button>

  <div class="main">

      <button class="hamburger" id="burger" aria-label="Menu"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div><div class="crumb" id="crumb">Overview</div><h1 id="pagetitle">Dashboard</h1></div>
      <div class="spacer"></div>
      <button class="btn btn--primary" id="newbtn"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg><span id="newbtnlabel">New task</span></button>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script>
(function(){
  "use strict";
  var API = window.AssetTrackAPI;
  var EMAIL_DOMAIN = "assettrack.local";          // usernames map to <username>@assettrack.local
  var TODAY = new Date().toISOString().slice(0,10);

  var MODULES = [
    { id:"dashboard", label:"Dashboard" }, { id:"tasks", label:"Tasks" }, { id:"installs", label:"Installations" },
    { id:"clients", label:"Clients" }, { id:"vehicles", label:"Vehicles" }, { id:"inventory", label:"Inventory" }, { id:"sims", label:"SIM cards" },
    { id:"reports", label:"Reports" }, { id:"team", label:"Team" }
  ];
  var ALL_PERMS = MODULES.map(function(m){return m.id;});

  var INSTALL_TYPES = [["new_install","New install"],["dash_cam","Dash cam"],["temp_sensor","Temp sensor"],["diesel_sensor","Diesel sensor"],["unit_swap","Unit swap"],["removal","Removal"],["maintenance","Maintenance"]];
  var INSTALL_LABEL = {}; var INSTALL_ENUM = {}; INSTALL_TYPES.forEach(function(p){ INSTALL_LABEL[p[0]]=p[1]; INSTALL_ENUM[p[1]]=p[0]; });
  var CATS = [["tracker","Tracker"],["sensor","Sensor"],["dash_cam","Dash cam"],["sd_card","SD card"],["fuel_sensor","Fuel sensor"],["harness","Harness"],["sim","SIM"],["consumable","Consumable"],["other","Other"]];
  var CAT_LABEL = {}; var CAT_ENUM = {}; CATS.forEach(function(p){ CAT_LABEL[p[0]]=p[1]; CAT_ENUM[p[1]]=p[0]; });
  var STATUS_LABEL = { open:"Open", in_progress:"In progress", done:"Completed", scheduled:"Scheduled", completed:"Completed" };

  var db = { users:[], clients:[], vehicles:[], sims:[], tasks:[], installs:[], inventory:[], currentUser:null };
  var clientIdByName = {}, clientNameById = {}, vehicleRegById = {};

  var esc = function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); };
  function user(id){ return db.users.find(function(u){return u.id===id;}); }
  function uName(id){ var u=user(id); return u?(u.name+" "+u.surname).trim():"Unassigned"; }
  function uFirst(id){ var u=user(id); return u?u.name:"Unassigned"; }
  function uInit(id){ var u=user(id); return u?u.init:"—"; }
  function cur(){ return user(db.currentUser); }
  function can(mod){ var u=cur(); return !!u && (u.role==="admin" || u.perms.indexOf(mod)>=0); }
  function isOverdue(t){ return t.status!=="done" && t.due && t.due<TODAY; }
  function cap(s){ return s?s.charAt(0).toUpperCase()+s.slice(1):s; }
  function rel(ts){ if(!ts) return "—"; var d=(Date.now()-new Date(ts).getTime())/1000; if(d<90)return"just now"; if(d<3600)return Math.round(d/60)+"m ago"; if(d<86400)return Math.round(d/3600)+"h ago"; return Math.round(d/86400)+"d ago"; }
  function fmtDate(ts){ if(!ts) return ""; try { return new Date(ts).toLocaleDateString(undefined,{month:"short",day:"numeric"}); } catch(e){ return String(ts).slice(0,10); } }

  /* ---------------- Load & map ---------------- */
  function mapAll(raw){
    db.clients = (raw.clients||[]).map(function(c){ return { id:c.id, name:c.name, industry:c.industry||"—", email:c.email||"", contact:c.contact_name||"—", phone:c.contact_phone||"—", fleet:c.fleet_size||0, products:c.products||[], expires:c.contract_expires||"—" }; });
    clientIdByName={}; clientNameById={};
    db.clients.forEach(function(c){ clientIdByName[c.name]=c.id; clientNameById[c.id]=c.name; });
    var vSim={}; (raw.sims||[]).forEach(function(s){ if(s.vehicle_id){ vSim[s.vehicle_id]={ state:s.state==="offline"?"offline":((s.data_today_mb||0)>150?"high":"active"), iccid:s.iccid }; } });
    db.vehicles = (raw.vehicles||[]).map(function(v){ return { id:v.id, registration:v.registration, client:clientNameById[v.client_id]||"—", make_model:v.make_model||"—", tracker:v.tracker_serial||"—", active:v.active!==false, sim:vSim[v.id]||null }; });
    vehicleRegById={}; (raw.vehicles||[]).forEach(function(v){ vehicleRegById[v.id]=v.registration; });
    db.users = (raw.profiles||[]).map(function(p){ return { id:p.id, name:p.first_name||"", surname:p.last_name||"", init:p.initials||"U", role:p.role, perms:p.module_access||[], phone:p.phone }; });

    var commentsByTask={};
    (raw.task_comments||[]).slice().sort(function(a,b){return a.created_at<b.created_at?-1:1;}).forEach(function(c){
      (commentsByTask[c.task_id]=commentsByTask[c.task_id]||[]).push({ who:(user(c.author_id)||{}).init||"·", txt:c.body, when:fmtDate(c.created_at) });
    });
    db.tasks = (raw.tasks||[]).map(function(t){ return { id:t.id, title:t.title, client:t.all_clients?"All clients":(clientNameById[t.client_id]||"—"), allClients:!!t.all_clients, tech:t.assigned_to, due:t.due_date||"", status:t.status, prio:t.priority, recurring:(t.recurrence&&t.recurrence!=="none")?cap(t.recurrence):null, recId:t.recurrence_id||null, comments:commentsByTask[t.id]||[], created_at:t.created_at, done_at:t.completed_at }; });

    db.installs = (raw.installations||[]).map(function(i){ return { id:i.id, ref:i.ref, client:clientNameById[i.client_id]||i.vehicle_reg||"—", contact:i.contact_name||"—", phone:i.contact_phone||"—", vehicle:i.vehicle_reg||(vehicleRegById[i.vehicle_id]||"—"), type:INSTALL_LABEL[i.job_type]||i.job_type, date:i.scheduled_date||"", time:(i.scheduled_time||"").slice(0,5), loc:i.location||"—", tech:i.assigned_to, status:i.status, photos:0, signed:!!i.signed }; });

    var movesByItem={};
    (raw.stock_movements||[]).slice().sort(function(a,b){return a.created_at<b.created_at?1:-1;}).forEach(function(m){
      (movesByItem[m.item_id]=movesByItem[m.item_id]||[]).push({ who:(user(m.performed_by)||{}).init||"·", client:clientNameById[m.client_id]||"—", qty:m.quantity, purpose:m.purpose||"—", date:fmtDate(m.created_at), dir:m.movement_type });
    });
    db.inventory = (raw.inventory_items||[]).map(function(v){ return { id:v.id, item:v.name, sku:v.sku||"—", cat:CAT_LABEL[v.category]||v.category, instock:v.in_stock, min:v.min_level, damaged:v.damaged, moves:movesByItem[v.id]||[] }; });

    db.sims = (raw.sims||[]).map(function(s){ var st = s.state==="offline"?"offline":((s.data_today_mb||0)>150?"high":"active"); return { id:s.id, iccid:s.iccid, msisdn:s.msisdn||"—", vehicle:vehicleRegById[s.vehicle_id]||"—", client:clientNameById[s.client_id]||"—", net:s.network||"—", status:st, lastseen:rel(s.last_seen), data:(s.data_today_mb||0)+" MB" }; });
  }

  /* ---------------- Persist (write-through) ---------------- */
  function warn(r, msg){ if(r && r.error){ console.error(r.error); toast((msg||"Save failed")+": "+r.error.message); return false; } return true; }
  var P = {
    createTask: async function(a){ var r=await API.createTask({ title:a.title, client_id:a.allClients?null:(clientIdByName[a.client]||null), all_clients:!!a.allClients, assigned_to:a.tech||null, due_date:a.due||null, status:"open", priority:a.prio, recurrence:a.recurring?a.recurring.toLowerCase():"none", created_by:db.currentUser }); if(warn(r,"Couldn't create task")) return r.data; return null; },
    updateTask: async function(id,patch){ warn(await API.updateTask(id,patch),"Couldn't update task"); },
    reassign: async function(id,tech){ warn(await API.reassignTask(id,tech),"Couldn't reassign"); },
    addComment: async function(taskId,body){ var r=await API.addComment({ task_id:taskId, author_id:db.currentUser, body:body }); warn(r,"Couldn't add comment"); return r.data; },
    createInstall: async function(a){ var r=await API.createInstall({ ref:a.ref, client_id:clientIdByName[a.client]||null, vehicle_reg:a.vehicle, contact_name:a.contact, contact_phone:a.phone, job_type:INSTALL_ENUM[a.type]||"new_install", scheduled_date:a.date||null, scheduled_time:a.time||null, location:a.loc, assigned_to:a.tech, status:"scheduled", created_by:db.currentUser }); if(warn(r,"Couldn't schedule installation")) return r.data; return null; },
    updateInstall: async function(id,patch){ warn(await API.updateInstall(id,patch),"Couldn't update installation"); },
    createClient: async function(a){ var r=await API.createClient({ name:a.name, industry:a.industry, email:a.email||null, contact_name:a.contact, contact_phone:a.phone, fleet_size:a.fleet, products:a.products, created_by:db.currentUser }); if(warn(r,"Couldn't add client")){ clientIdByName[a.name]=r.data.id; clientNameById[r.data.id]=a.name; return r.data; } return null; },
    moveStock: async function(itemId,type,qty,clientName,purpose,note){ warn(await API.moveStock({ item_id:itemId, movement_type:type, quantity:qty, client_id:clientIdByName[clientName]||null, performed_by:db.currentUser, purpose:purpose, note:note||null }),"Couldn't record movement"); },
    createItem: async function(a){ var r=await API.createItem({ name:a.item, sku:a.sku, category:CAT_ENUM[a.cat]||"other", in_stock:a.instock, min_level:a.min }); if(warn(r,"Couldn't add item")) return r.data; return null; },
    updateProfile: async function(id,patch){ warn(await API.updateProfile(id,patch),"Couldn't update user"); },
    createUser: async function(payload){ var r=await API.createUser(payload); if(warn(r,"Couldn't create user")) return r.data; return null; },
    createRecurrence: async function(a){ var r=await API.createRecurrence({ title:a.title, client_id:a.allClients?null:(clientIdByName[a.client]||null), all_clients:!!a.allClients, assigned_to:a.tech||null, priority:a.prio, frequency:a.recurring.toLowerCase(), anchor_date:a.due||null, note:a.note||null, created_by:db.currentUser }); if(warn(r,"Couldn't set up recurring task")) return r.data; return null; },
    stopRecurrence: async function(id){ warn(await API.stopRecurrence(id),"Couldn't stop repeat"); },
    deleteTask: async function(id){ var r=await API.deleteTask(id); if(r&&r.error){ toast("Couldn't delete task"); return false; } return true; }
  };

  /* ---------------- Nav ---------------- */
  var NAV_GROUPS = [ { label:"Overview", items:["dashboard"] }, { label:"Operations", items:["tasks","installs","clients","vehicles"] }, { label:"Assets", items:["inventory","sims"] }, { label:"Insight", items:["reports"] }, { label:"Admin", items:["team"] } ];
  var NAV_ICON = {
    dashboard:'<path d="M3 13h8V3H3zM13 21h8V8h-8zM3 21h8v-6H3zM13 3v3h8V3z"/>',
    tasks:'<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
    installs:'<path d="M3 7h18M3 12h18M3 17h18"/>',
    clients:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>',
    vehicles:'<path d="M1 6h14v9H1z"/><path d="M15 9h4l3 3v3h-7z"/><circle cx="5.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/>',
    inventory:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12l8.73-5.04"/>',
    sims:'<path d="M5 3h10l4 4v14H5z"/><path d="M9 13h6M9 17h6M9 9h2"/>',
    reports:'<path d="M3 3v18h18"/><path d="M7 14l3-3 3 3 5-6"/>',
    team:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'
  };
  var counts = {};
  function recount(){ counts.tasks=db.tasks.filter(function(t){return t.status!=="done";}).length; counts.installs=db.installs.filter(function(i){return i.status!=="completed";}).length; counts.sims=db.sims.filter(function(s){return s.status==="offline";}).length; counts.team=db.users.length; }
  function renderNav(){
    recount(); var html="";
    NAV_GROUPS.forEach(function(g){ var items=g.items.filter(function(id){return can(id);}); if(!items.length)return; html+='<div class="nav__label">'+g.label+'</div>';
      items.forEach(function(id){ var m=MODULES.find(function(x){return x.id===id;}); var ct=counts[id];
        html+='<button class="nav__item'+(id===route?' is-active':'')+'" data-nav="'+id+'"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">'+NAV_ICON[id]+'</svg><span>'+m.label+'</span>'+(ct?'<span class="ct">'+ct+'</span>':'')+'</button>';
      });
    });
    document.getElementById("nav").innerHTML=html;
  }
  function renderUser(){ var u=cur(); document.getElementById("railAvatar").textContent=u.init; document.getElementById("railName").textContent=(u.name+" "+u.surname).trim(); document.getElementById("railRole").textContent=(u.role==="admin"?"Admin":"Technician")+" · Gaborone"; }

  function toast(msg){ var w=document.getElementById("toasts"); var el=document.createElement("div"); el.className="toast"; el.innerHTML='<span class="d"></span>'+esc(msg); w.appendChild(el); setTimeout(function(){ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(function(){el.remove();},300); }, 2800); }

  var view = document.getElementById("view");
  var route = "dashboard";
  var PAGE = {
    dashboard:{t:"Dashboard",c:"Overview",btn:"New task",fn:function(){ if(can('tasks')) openTaskForm(); }},
    tasks:{t:"Tasks",c:"Operations",btn:"New task",fn:function(){ openTaskForm(); }},
    installs:{t:"Installations",c:"Operations",btn:"New installation",fn:function(){ openInstallForm(); }},
    clients:{t:"Clients",c:"Operations",btn:"New client",fn:function(){ openClientForm(); }},
    vehicles:{t:"Vehicles",c:"Operations",btn:"Import CSV",fn:function(){ openCsvImport(); }},
    inventory:{t:"Inventory",c:"Assets",btn:"Add item",fn:function(){ openItemForm(); }},
    sims:{t:"SIM cards",c:"Assets",btn:"Sync portal",fn:function(){ toast("SIM sync runs server-side (1oT API) — wiring next."); }},
    reports:{t:"Reports",c:"Insight",btn:"Export",fn:function(){ toast("Report export — coming soon"); }},
    team:{t:"Team",c:"Admin",btn:"New user",fn:function(){ openUserForm(); }}
  };
  function go(r){ if(!can(r)){ r=cur().perms[0]||"dashboard"; } route=r; var p=PAGE[r];
    document.getElementById("pagetitle").textContent=p.t; document.getElementById("crumb").textContent=p.c; document.getElementById("newbtnlabel").textContent=p.btn;
    document.getElementById("newbtn").style.display=(r==="sims"||r==="reports")?"none":"";
    renderNav(); render(); closeRail(); window.scrollTo(0,0);
  }
  function render(){ ({ dashboard:renderDashboard, tasks:renderTasks, installs:renderInstalls, clients:renderClients, vehicles:renderVehicles, inventory:renderInventory, sims:renderSims, reports:renderReports, team:renderTeam }[route])(); labelTables(); }
  function labelTables(){
    document.querySelectorAll("table.data").forEach(function(tbl){
      var ths=[].map.call(tbl.querySelectorAll("thead th"), function(th){ return th.textContent.trim(); });
      [].forEach.call(tbl.querySelectorAll("tbody tr"), function(tr){
        [].forEach.call(tr.children, function(td,i){ if(!td.hasAttribute("colspan") && ths[i]!==undefined) td.setAttribute("data-label", ths[i]); });
      });
    });
  }

  function taskStatusBadge(t){ if(isOverdue(t))return '<span class="badge b-crit"><span class="d"></span>Overdue</span>'; if(t.status==="done")return '<span class="badge b-good"><span class="d"></span>Completed</span>'; if(t.status==="in_progress")return '<span class="badge b-warn"><span class="d"></span>In progress</span>'; return '<span class="badge b-info"><span class="d"></span>Open</span>'; }
  function prioBadge(p){ return '<span class="badge prio-'+p+'">'+cap(p)+'</span>'; }
  function simBadge(s){ if(s==="offline")return '<span class="badge b-crit"><span class="d"></span>Offline</span>'; if(s==="high")return '<span class="badge b-warn"><span class="d"></span>High usage</span>'; return '<span class="badge b-good"><span class="d"></span>Active</span>'; }
  function field(l,v){ return '<div class="field"><label>'+esc(l)+'</label><div class="v">'+esc(v)+'</div></div>'; }
  function kpi(label,val,unit,meta,accent,link){ var a=link?(' data-kpi="1"'+(link.nav?' data-k-nav="'+link.nav+'"':'')+(link.tf?' data-k-tf="'+link.tf+'"':'')+(link.of?' data-k-of="'+link.of+'"':'')):''; return '<div class="kpi'+(accent?' accent':'')+(link?' kpi--link':'')+'"'+a+'><div class="kpi__label">'+esc(label)+'</div><div class="kpi__val tnum">'+val+(unit?'<small>'+unit+'</small>':'')+'</div><div class="kpi__meta">'+meta+'</div></div>'; }

  /* ---------------- Dashboard ---------------- */
  function renderDashboard(){
    var me=db.currentUser, isAdmin=cur().role==="admin";
    var myTasks=db.tasks.filter(function(t){return t.tech===me&&t.status!=="done";});
    var totalTasks=db.tasks.length;
    var openT=db.tasks.filter(function(t){return t.status!=="done";}).length;
    var doneT=totalTasks-openT;
    var overdue=db.tasks.filter(isOverdue).length;
    var myOverdue=db.tasks.filter(function(t){return t.tech===me&&isOverdue(t);}).length;
    var techIds=db.users.filter(function(u){return u.role==="technician";}).map(function(u){return u.id;});
    var techTasks=db.tasks.filter(function(t){return t.status!=="done"&&techIds.indexOf(t.tech)>=0;}).length;
    var installsWk=db.installs.filter(function(i){return i.status!=="completed";}).length;
    var simsOff=db.sims.filter(function(s){return s.status==="offline";}).length;
    var onlinePct=db.sims.length?Math.round((db.sims.length-simsOff)/db.sims.length*100):100;
    var totalVehicles=db.clients.reduce(function(a,c){return a+(c.fleet||0);},0);
    var lowStock=db.inventory.filter(function(v){return v.instock<v.min;}).length;
    var todays=db.installs.filter(function(i){return i.date===TODAY;});
    var alerts=[];
    db.sims.filter(function(s){return s.status==="offline";}).forEach(function(s){ alerts.push({c:"var(--crit)",t:"SIM offline — "+s.vehicle+" ("+s.client+")",m:"No data for "+s.lastseen+" · "+s.iccid,act:"Create task",fn:function(){ quickOfflineTask(s); }}); });
    db.inventory.filter(function(v){return v.instock<v.min;}).forEach(function(v){ alerts.push({c:"var(--warn)",t:"Low stock — "+v.item,m:v.instock+" in stock · minimum "+v.min,act:"View",fn:function(){ go("inventory"); }}); });
    db.tasks.filter(isOverdue).forEach(function(t){ alerts.push({c:"var(--crit)",t:"Task overdue — "+t.title,m:"Due "+t.due+" · "+uFirst(t.tech),act:"Open",fn:function(){ openTask(t.id); }}); });

    var html='<div class="kpis">'
      +kpi("Total tasks",totalTasks,'',openT+" open · "+doneT+" completed",false,{nav:"tasks",of:"everyone",tf:"all"})
      +kpi("Open tasks",openT,'',overdue?('<span class="down">'+overdue+' overdue</span>'):'All on schedule',true,{nav:"tasks",of:"everyone",tf:"all"})
      +kpi("My open tasks",myTasks.length,'',myOverdue?('<span class="down">'+myOverdue+' overdue</span>'):'Assigned to me',false,{nav:"tasks",of:"mine",tf:"all"})

  function setupSigPad(canvas, ready){ if(!canvas)return; var ctx=canvas.getContext("2d");
    function resize(){ var r=canvas.getBoundingClientRect(); canvas.width=r.width*2; canvas.height=r.height*2; ctx.scale(2,2); ctx.lineWidth=2.2; ctx.lineCap="round"; ctx.strokeStyle=getComputedStyle(document.body).color; }
    resize(); var drawing=false, ink=false, last=null;
    function pos(e){ var r=canvas.getBoundingClientRect(); var pt=e.touches?e.touches[0]:e; return {x:pt.clientX-r.left,y:pt.clientY-r.top}; }
    function start(e){ drawing=true; last=pos(e); e.preventDefault(); }
    function move(e){ if(!drawing)return; var p=pos(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; ink=true; e.preventDefault(); }
    function end(){ drawing=false; }
    canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
    canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false}); canvas.addEventListener("touchend",end);
    _sigClear=function(){ ctx.clearRect(0,0,canvas.width,canvas.height); ink=false; }; ready(function(){ return ink; });
  }

    db.vehicles.forEach(function(v){
      var sim = v.sim ? (v.sim.state==="offline"?'<span class="badge b-crit"><span class="d"></span>Offline</span>':v.sim.state==="high"?'<span class="badge b-warn"><span class="d"></span>High usage</span>':'<span class="badge b-good"><span class="d"></span>Online</span>') : '<span class="cellmuted">No SIM</span>';
      html+='<tr><td style="font-weight:600">'+esc(v.registration)+'</td><td>'+esc(v.client)+'</td><td>'+esc(v.make_model)+'</td><td class="cellmuted">'+esc(v.tracker)+'</td><td>'+sim+'</td></tr>';
    });
    html+='</tbody></table></div></div></div><div class="inline-note" style="margin-top:14px"><span>ⓘ</span><span>Vehicles populate from the weekly CSV import (Import CSV above or on the Clients page). Each links to its client and SIM.</span></div>';
    view.innerHTML=html;
  }

  /* ---------------- Reports ---------------- */
  function renderReports(){
    var tasks=db.tasks, installs=db.installs;
    var openTasks=tasks.filter(function(t){return t.status!=="done";});
    var doneTasks=tasks.filter(function(t){return t.status==="done";});
    var overdue=tasks.filter(isOverdue);
    var incompleteInstalls=installs.filter(function(i){return i.status!=="completed";});
    var clientsWithOpen={}; openTasks.forEach(function(t){ clientsWithOpen[t.client]=(clientsWithOpen[t.client]||0)+1; });
    var clientNames=Object.keys(clientsWithOpen).sort(function(a,b){return clientsWithOpen[b]-clientsWithOpen[a];});
    var avgOpenPerClient=db.clients.length?(openTasks.length/db.clients.length):0;
    var days=[]; for(var d=6;d>=0;d--){ var dt=new Date(); dt.setDate(dt.getDate()-d); days.push({ key:dt.toISOString().slice(0,10), label:dt.toLocaleDateString(undefined,{weekday:'short'}), n:0 }); }
    doneTasks.forEach(function(t){ var k=(t.done_at||"").slice(0,10); var b=days.find(function(x){return x.key===k;}); if(b) b.n++; });
    var maxDay=Math.max(1,Math.max.apply(null,days.map(function(x){return x.n;})));
    var techs=db.users.filter(function(u){return u.role==="technician";});
    var perTech=techs.map(function(t){ return { name:(t.name+" "+t.surname).trim()||t.init, open:tasks.filter(function(k){return k.tech===t.id&&k.status!=="done";}).length, done:tasks.filter(function(k){return k.tech===t.id&&k.status==="done";}).length, inst:installs.filter(function(i){return i.tech===t.id&&i.status==="completed";}).length }; });
    function kpiR(l,v,m,cls){ return '<div class="kpi"><div class="kpi__label">'+l+'</div><div class="kpi__val tnum">'+v+'</div><div class="kpi__meta'+(cls?' '+cls:'')+'">'+m+'</div></div>'; }
    var html='<div class="kpis">'
      +kpiR("Open tasks",openTasks.length,overdue.length?overdue.length+' overdue':'none overdue',overdue.length?'down':'')
      +kpiR("Completed tasks",doneTasks.length,'all time')
      +kpiR("Avg open / client",avgOpenPerClient.toFixed(1),'across '+db.clients.length+' clients')
      +kpiR("Incomplete installs",incompleteInstalls.length,'scheduled + in progress')
      +kpiR("Vehicles",db.vehicles.length,'tracked')
      +kpiR("SIMs offline",db.sims.filter(function(s){return s.status==="offline";}).length,'needs attention')
    +'</div><div class="grid grid--2">'
      +'<div class="card"><div class="card__head"><h3>Outstanding tasks per client</h3></div><div class="card__body">'
      +(clientNames.length?clientNames.map(function(n){ var w=Math.round(clientsWithOpen[n]/Math.max(1,clientsWithOpen[clientNames[0]])*100); return '<div class="barrow"><div class="nm">'+esc(n)+'</div><div class="bartrack"><div class="barfill" style="width:'+w+'%"></div></div><div class="vv tnum">'+clientsWithOpen[n]+'</div></div>'; }).join(''):'<div class="empty">No open tasks</div>')
      +'</div></div>'
      +'<div class="card"><div class="card__head"><h3>Tasks closed per day</h3><div class="spacer"></div><span class="cellmuted">Last 7 days</span></div><div class="card__body"><div style="display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 4px">'
      +days.map(function(x){ var h=Math.round(x.n/maxDay*120); return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px"><div class="tnum" style="font-size:12px;font-weight:600">'+x.n+'</div><div style="width:100%;max-width:34px;height:'+Math.max(2,h)+'px;background:var(--brand-red);border-radius:5px 5px 0 0"></div><div class="cellmuted">'+x.label+'</div></div>'; }).join('')
      +'</div></div></div></div>'
      +'<div class="card" style="margin-top:16px"><div class="card__head"><h3>Technician workload</h3></div><div class="card__body flush"><div class="tablewrap"><table class="data"><thead><tr><th>Technician</th><th>Open tasks</th><th>Completed</th><th>Installs done</th></tr></thead><tbody>'
      +(perTech.length?perTech.map(function(p){ return '<tr><td style="font-weight:600">'+esc(p.name)+'</td><td class="tnum">'+p.open+'</td><td class="tnum">'+p.done+'</td><td class="tnum">'+p.inst+'</td></tr>'; }).join(''):'<tr><td colspan="4"><div class="empty">No technicians yet</div></td></tr>')
      +'</tbody></table></div></div></div>'
      +'<div class="card" style="margin-top:16px"><div class="card__head"><h3>Installations by status</h3></div><div class="card__body">'
      +['scheduled','in_progress','completed'].map(function(st){ var n=installs.filter(function(i){return i.status===st;}).length; var w=Math.round(n/Math.max(1,installs.length)*100); return '<div class="barrow"><div class="nm">'+STATUS_LABEL[st]+'</div><div class="bartrack"><div class="barfill" style="width:'+w+'%;background:'+(st==="completed"?'var(--good)':st==="in_progress"?'var(--warn)':'var(--info)')+'"></div></div><div class="vv tnum">'+n+'</div></div>'; }).join('')
      +'</div></div>'
      +'<div class="inline-note" style="margin-top:14px"><span>ⓘ</span><span>Reports read live from your records — they fill out as the team logs tasks and installations.</span></div>';
    view.innerHTML=html;
  }

  /* ---------------- Team ---------------- */
  function renderTeam(){
    var html='<div class="card"><div class="card__body flush"><div class="tablewrap"><table class="data"><thead><tr><th>Name</th><th>Role</th><th>Access</th><th></th></tr></thead><tbody>';
    db.users.forEach(function(u){ html+='<tr><td><div style="display:flex;align-items:center;gap:10px"><span class="avatar" style="width:30px;height:30px">'+esc(u.init)+'</span><div style="font-weight:600">'+esc((u.name+" "+u.surname).trim())+'</div></div></td><td>'+(u.role==="admin"?'<span class="badge b-info">Admin</span>':'<span class="badge b-neutral">Technician</span>')+'</td><td><div class="pills">'+(u.role==="admin"?'<span class="pill">Full access</span>':u.perms.map(function(p){var m=MODULES.find(function(x){return x.id===p;});return '<span class="pill">'+esc(m?m.label:p)+'</span>';}).join(''))+'</div></td><td><button class="btn btn--sm" data-edituser="'+u.id+'">Edit</button></td></tr>'; });
    html+='</tbody></table></div></div></div><div class="inline-note" style="margin-top:14px"><span>ⓘ</span><span>Use <b>New user</b> to create a login (username + temporary password) and set exactly what they can access. Admins automatically see every module.</span></div>';
    view.innerHTML=html;
    view.querySelectorAll("[data-edituser]").forEach(function(b){ b.onclick=function(){ openUserForm(b.dataset.edituser); }; });
  }
  function openUserForm(id){
    var u=id?user(id):null;
    var creating=!u;
    var editable=MODULES.filter(function(m){return m.id!=="team";});
    var head=creating
      ? '<div class="form-2"><div class="form-row"><label class="lbl">Username</label><input id="uf-username" placeholder="e.g. katlao" autocapitalize="off" autocorrect="off" spellcheck="false"></div><div class="form-row"><label class="lbl">Temporary password</label><input id="uf-password" type="text" placeholder="min 6 characters"></div></div>'
        +'<div class="inline-note" style="margin:0 0 14px"><span>ⓘ</span><span>They sign in with this username and password. Ask them to change the password after first login.</span></div>'
      : '';
    var body=head
      +'<div class="form-2"><div class="form-row"><label class="lbl">First name</label><input id="uf-name" value="'+esc(u?u.name:"")+'"></div><div class="form-row"><label class="lbl">Surname</label><input id="uf-surname" value="'+esc(u?u.surname:"")+'"></div></div>'
      +'<div class="form-row"><label class="lbl">Phone (optional)</label><input id="uf-phone" value="'+esc(u&&u.phone?u.phone:"")+'" placeholder="+267…"></div>'
      +'<div class="form-row"><label class="lbl">Role</label><select id="uf-role"><option value="technician"'+(u&&u.role==="technician"?' selected':'')+'>Technician</option><option value="admin"'+(u&&u.role==="admin"?' selected':'')+'>Admin (full access)</option></select></div>'
      +'<div class="form-row" id="uf-permsrow"><label class="lbl">What they can access</label><div class="checks" id="uf-perms">'+editable.map(function(m){var on=u?u.perms.indexOf(m.id)>=0:(m.id==="dashboard"||m.id==="tasks"||m.id==="installs");return '<label class="check"><input type="checkbox" value="'+m.id+'"'+(on?' checked':'')+'><span>'+esc(m.label)+'</span></label>';}).join('')+'</div></div>';
    openModal(creating?"New user":"Edit user", body, [ { label:"Cancel", cls:"btn", fn:closeModal }, { label:creating?"Create user":"Save", cls:"btn btn--primary", fn:async function(){
          var name=document.getElementById("uf-name").value.trim(), sur=document.getElementById("uf-surname").value.trim(), role=document.getElementById("uf-role").value, phone=document.getElementById("uf-phone").value.trim();
          var perms=role==="admin"?ALL_PERMS.slice():Array.prototype.slice.call(document.querySelectorAll("#uf-perms input:checked")).map(function(x){return x.value;});
          if(perms.indexOf("dashboard")<0) perms.unshift("dashboard");
          var init=((name[0]||"")+(sur[0]||"")).toUpperCase()||"U";
          if(creating){
            var username=document.getElementById("uf-username").value.trim().toLowerCase().replace(/\s+/g,""), pw=document.getElementById("uf-password").value;
            if(!username){ toast("Enter a username"); return; }
            if(pw.length<6){ toast("Password must be at least 6 characters"); return; }
            if(!name){ toast("Enter a first name"); return; }
            var btn=this; var old=btn.textContent; btn.textContent="Creating…"; btn.disabled=true;
            var res=await P.createUser({ username:username, password:pw, first_name:name, last_name:sur, phone:phone, role:role, module_access:perms });
            if(!res){ btn.textContent=old; btn.disabled=false; return; }
            db.users.push({ id:res.id, name:name, surname:sur, init:init, role:role, perms:perms, phone:phone });
            closeModal(); toast("User created · "+username); renderTeam();
          } else {
            u.name=name; u.surname=sur; u.role=role; u.perms=perms; u.init=init; u.phone=phone;
            P.updateProfile(u.id,{ first_name:name, last_name:sur, initials:init, role:role, module_access:perms, phone:phone||null });
            renderNav(); if(u.id===db.currentUser) renderUser(); closeModal(); toast("User updated"); renderTeam();
          }
        } } ]);
    syncChecks("uf-perms");
    var roleSel=document.getElementById("uf-role"); roleSel.onchange=function(){ document.getElementById("uf-permsrow").style.display=roleSel.value==="admin"?"none":""; }; roleSel.onchange();
  }
  function syncChecks(wrapId){ var wrap=document.getElementById(wrapId); if(!wrap)return; wrap.querySelectorAll(".check").forEach(function(l){ var inp=l.querySelector("input"); function up(){ l.classList.toggle("on",inp.checked); } inp.addEventListener("change",up); up(); }); }

  /* ---------------- Modal ---------------- */
  var modalEl=null;
  function openModal(title, bodyHtml, actions){
    closeModal(); _sigClear=null;
    modalEl=document.createElement("div"); modalEl.className="modal-sheet";
    modalEl.innerHTML='<div class="modal-sheet__scrim"></div><div class="modal" role="dialog" aria-modal="true"><div class="modal__head"><h3>'+esc(title)+'</h3><div class="spacer"></div><button class="modal__x" aria-label="Close">×</button></div><div class="modal__body">'+bodyHtml+'</div><div class="modal__foot"></div></div>';
    document.body.appendChild(modalEl);
    var foot=modalEl.querySelector(".modal__foot");
    (actions||[]).forEach(function(a){ var b=document.createElement("button"); b.className=a.cls; b.textContent=a.label; b.onclick=a.fn; foot.appendChild(b); });
    modalEl.querySelector(".modal-sheet__scrim").onclick=closeModal; modalEl.querySelector(".modal__x").onclick=closeModal;
    document.body.style.overflow="hidden";
  }
  function closeModal(){ if(modalEl){ modalEl.remove(); modalEl=null; document.body.style.overflow=""; } }
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") closeModal(); });

  /* ---------------- Rail (mobile) ---------------- */
  function openRail(){ document.getElementById("rail").classList.add("is-open"); document.getElementById("scrim").classList.add("is-on"); }
  function closeRail(){ document.getElementById("rail").classList.remove("is-open"); document.getElementById("scrim").classList.remove("is-on"); }
  document.getElementById("burger").onclick=openRail; document.getElementById("scrim").onclick=closeRail;
  document.getElementById("newbtn").onclick=function(){ PAGE[route].fn(); };
  document.getElementById("nav").addEventListener("click",function(e){ var b=e.target.closest("[data-nav]"); if(b) go(b.dataset.nav); });
  document.getElementById("signout").onclick=async function(){ await API.signOut(); location.reload(); };

  /* ---------------- Auth + boot ---------------- */
  function showLogin(msg){
    document.getElementById("bootScreen").hidden=true;
    document.getElementById("app").hidden=true;
    var l=document.getElementById("login"); l.hidden=false;
    var err=document.getElementById("loginErr"); if(msg){ err.textContent=msg; err.hidden=false; } else err.hidden=true;
  }
  async function loadAndStart(){
    document.getElementById("login").hidden=true;
    var boot=document.getElementById("bootScreen"); boot.hidden=false; boot.textContent="Loading your data…";
    var me=await API.myProfile();
    if(!me){ showLogin("Could not load your profile. Contact your admin."); return; }
    try { await API.generateDaily(); } catch(e){ /* non-fatal: the morning cron also covers this */ }
    var raw=await API.loadAll(); mapAll(raw);
    if(!db.users.find(function(u){return u.id===me.id;})) db.users.push({ id:me.id, name:me.first_name||"", surname:me.last_name||"", init:me.initials||"U", role:me.role, perms:me.module_access||[], phone:me.phone });
    db.currentUser=me.id;
    boot.hidden=true; document.getElementById("app").hidden=false;
    renderUser(); renderNav(); go(cur().perms[0]||"dashboard");
  }
  document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();
    var username=document.getElementById("loginUser").value.trim().toLowerCase(); var pass=document.getElementById("loginPass").value;
    if(!username||!pass){ showLogin("Enter your username and password."); return; }
    var btn=document.getElementById("loginBtn"); btn.disabled=true; btn.textContent="Signing in…";
    var email=username.indexOf("@")>=0?username:(username+"@"+EMAIL_DOMAIN);
    var r=await API.signIn(email,pass);
    btn.disabled=false; btn.textContent="Sign in";
    if(r.error){ showLogin("Wrong username or password."); return; }
    loadAndStart();
  });
  async function boot(){
    if(!API){ document.getElementById("bootScreen").textContent="Config error — check js/config.js"; return; }
    var s=await API.currentSession();
    if(s && s.data && s.data.session){ loadAndStart(); } else { showLogin(); }
  }
  boot();
})();
</script>
</body>
</html>
